name: Reward audit

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reward-audit tool tests
        run: python3 -m unittest discover -s tools/reward_audit/tests -v

      - name: Manifest is complete
        run: python3 tools/reward_audit/check.py --validate

      - name: Protected reward assets need review
        if: github.event_name == 'pull_request'
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if git fetch --no-tags origin "$BASE_REF"; then
            BASE="origin/$BASE_REF"
          else
            git fetch --no-tags "https://github.com/${GITHUB_REPOSITORY}.git" "$BASE_REF"
            BASE="FETCH_HEAD"
          fi
          python3 tools/reward_audit/check.py --base "$BASE" --labels "$PR_LABELS"
