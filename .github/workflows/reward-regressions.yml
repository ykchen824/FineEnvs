name: Reward regressions

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  adversarial:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Adversarial reward tests (no GPU, network or secrets)
        run: python3 -m unittest discover -s tools/reward_audit/tests -v
