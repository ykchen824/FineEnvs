name: GeoGuesser

on:
  pull_request:
    paths: ['03-geoguesser/**', '.github/workflows/geoguesser.yml']
  push:
    branches: [main]
    paths: ['03-geoguesser/**', '.github/workflows/geoguesser.yml']

permissions:
  contents: read

jobs:
  env-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'

      - name: Environment, reward and identity tests
        run: >-
          uv run --frozen --project 03-geoguesser/env --extra dev
          pytest 03-geoguesser/env/tests -q

  reward-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: 03-geoguesser/eval
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest
        run: python -m pip install pytest

      - name: Reference reward curve and training defaults
        run: python -m pytest test_reward_parity.py -q
