name: Run provenance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Provenance tool tests
        run: python3 -m unittest discover -s tools/run_provenance/tests -v

  smoldataenvs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test runner
        run: python -m pip install pytest
      - name: Script and provenance tests (no sandbox, GPU, or network)
        run: python -m pytest 04-smoldataenvs/tests -q

  multi-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install pytest==9.1.1 httpx
      - name: Evaluation and provenance tests
        run: python -m pytest 05-multi-harness-rl/tests -q
